services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    networks:
      adguard_network:
        ipv4_address: "192.168.50.145"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "784:784/udp"
      - "853:853/tcp"
    volumes:
      - agh_work:/opt/adguardhome/work
      - agh_conf:/opt/adguardhome/conf
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      start_period: 30s

  npm:
    image: 'jc21/nginx-proxy-manager:2.15.1'
    container_name: npm
    restart: unless-stopped
    environment:
      TZ: "Europe/Warsaw"
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:81/ >/dev/null || exit 1"]
      start_period: 30s
    volumes:
      - ./npm_data:/data
      - ./letsencrypt:/etc/letsencrypt

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - PUID=1001
      - PGID=1001
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\""]
      start_period: 30s

volumes:
  agh_conf:
  agh_work:
  dockhand_data:
    external: true

networks:
  adguard_network:
    driver: macvlan
    driver_opts:
      parent: eno1
    ipam:
      config:
        - subnet: 192.168.50.0/24
          gateway: 192.168.50.1
          ip_range: 192.168.50.145/32
